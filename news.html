<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Notícias - Outlast Fanpage</title>
        <link rel="stylesheet" href="src/css/news.css">

        <!-- FONTES -->
        <link href="https://fonts.cdnfonts.com/css/base-02" rel="stylesheet">
        <link href="https://fonts.cdnfonts.com/css/special-elite" rel="stylesheet">
        <link href="https://fonts.cdnfonts.com/css/barlow-semi-condensed" rel="stylesheet">

        <!-- ICONS -->
        <link rel="shortcut icon" href="assets/icons/icon.png">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

        <!-- JAVASCRIPT -->
        <script src="src/js/script.js" defer></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
        <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    </head>
    <body>
        <header class="header">
            <a href="index.html" class="logo">
                <img src="assets/icons/outlast-logo.png" alt>
            </a>
            <nav>
                <a href="index.html">INÍCIO</a>
                <a class="active" href="news.html">NOTÍCIAS</a>
                <a href="hqs.html">HQS</a>
                <a href="games.html">JOGOS</a>
                <a href="gallery.html">GALERIA</a>
                <a href="about.html">SOBRE</a>
            </nav>
            <a href class="btn-join"><p>ENTRAR NO ASILO</p><b>◆</b></a>
        </header>
        <section class="hero-noticias">
            <div class="hero-noticias-bg">
                <img src="assets/img/noticias-bg.png" alt>
                <div class="hero-noticias-overlay"></div>
            </div>

            <div class="rec-badge reveal-fade">
                <span class="rec-dot"></span>
                REC &nbsp; <span id="rec-timer">00:00:00</span>
            </div>

            <div class="corner corner-tl reveal-corner"></div>
            <div class="corner corner-tr reveal-corner"></div>
            <div class="corner corner-bl reveal-corner"></div>
            <div class="corner corner-br reveal-corner"></div>

            <div class="hero-noticias-content">
                <span class="hero-noticias-label reveal-up" style="--delay: 0.1s">MURKOFF DATABASE //</span>
                <h1 class="reveal-up" style="--delay: 0.3s">NOTÍCIAS</h1>
                <p class="reveal-up" style="--delay: 0.5s">Relatórios, vazamentos, teorias e atualizações<br>sobre o
                    universo de Outlast.</p>
            </div>

            <div class="murkoff-watermark reveal-fade" style="--delay: 0.8s">
                <img src="assets/icons/footer-icon.png" alt>
                <span>MURKOFF</span>
            </div>
        </section>
        <section class="noticias-filtros">
            <div class="filtros-categorias">
                <button class="filtro-btn active" data-filtro="todos">TODOS</button>
                <button class="filtro-btn" data-filtro="outlast-trials">OUTLAST TRIALS</button>
                <button class="filtro-btn" data-filtro="outlast">OUTLAST</button>
                <button class="filtro-btn" data-filtro="outlast-2">OUTLAST 2</button>
                <button class="filtro-btn" data-filtro="hqs">HQs</button>
                <button class="filtro-btn" data-filtro="teorias">TEORIAS</button>
                <button class="filtro-btn" data-filtro="eventos">EVENTOS</button>
            </div>
            <div class="filtros-busca">
                <input type="text" id="busca-input" placeholder="Buscar notícia...">
                <button id="busca-btn"><i class='bx bx-search'></i></button>
            </div>
        </section>
    </body>
</html>
